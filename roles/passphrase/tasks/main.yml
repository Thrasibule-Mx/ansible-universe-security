- name: "Generate passphrase sequences"
  ansible.builtin.set_fact:
    _passphrase_sequences: >-
      {%- set sequences = [] -%}
      {%- for _ in range(passphrase_words_count) -%}
        {%- set _ = sequences.append(
          lookup(
            'community.general.random_string',
            length=5,
            override_all='123456',
          )
        ) -%}
      {%- endfor -%}
      {{ sequences }}

- name: "Set passphrase"
  ansible.builtin.set_fact:
    passphrase_result: >-
      {{
        _passphrase_sequences
        | map('ansible.builtin.extract', passphrase_words)
        | join(passphrase_words_separator)
      }}
