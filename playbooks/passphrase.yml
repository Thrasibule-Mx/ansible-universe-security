- name: "Passphrase"
  hosts: "{{ playbook_hosts | default('localhost') }}"
  gather_facts: false
  vars_prompt:
    - name: "_playbook_passphrase_words_count"
      prompt: "Words"
      default: "6"
      private: false
    - name: "passphrase_words_separator"
      prompt: "Separator"
      default: "-"
      private: false
  vars:
    passphrase_words_count: "{{ _playbook_passphrase_words_count | int }}"
  roles:
    - "universe.security.passphrase"
  tasks:
    - name: "Display passphrase"
      ansible.builtin.debug:
        msg: "{{ passphrase_result }}"
